name: Daily forecast

# Four tries a day, at 10:30, 12:30, 14:30 and 16:30 UTC (14:00 to 20:00 in Tehran, all after the
# 12:00 Tehran cutoff): issue the forecast for tomorrow's Tehran date, fill in outcomes for days
# that have ended, commit data/predictions.json, then build the site and deploy it to GitHub Pages in
# this same workflow. (A commit pushed with GITHUB_TOKEN does not trigger other workflows, so the
# deploy cannot live in a separate one.) The target date comes from Tehran time inside the script,
# never from the runner's clock, so a late or manually started run still forecasts the right day.
#
# Why four tries: a forecast needs two sources. Open-Meteo's own run metadata, checked 2026-11-12, showed
# the CAMS 00 UTC run available at 10:06 UTC (10.1 hours after it starts; the check of 2026-11-04 measured
# 9.7 hours) and the ECMWF 00 UTC run about 06:24 UTC (6.4 hours; the check of 2026-11-03 measured 6.8 hours).
# Each is one observation, not a guarantee. CAMS counts as ready only when Open-Meteo's run metadata says
# its latest run began at or after 00:00 UTC on the issue day (complete hours alone prove nothing: they can
# be filled from the previous run). So the first try at 10:30 UTC usually has both. A try saves a
# cell only when both are ready and never changes a saved forecast; a cell that is not ready is left for
# the next try (exit status 4). The last try (16:30 UTC) is told it is final and records a gap with the
# reason. GitHub has delayed scheduled runs by up to 9.5 hours, and Tehran midnight is 20:30 UTC: a
# forecast saved after that is marked as made late. Any run from 21:00 Tehran time (17:30 UTC) on is also
# a final try.
#
# A gap is only recorded by a final try. If the 16:30 run is dropped by GitHub or cancelled (a run queued
# behind a running one replaces an older pending run, even with cancel-in-progress: false, so a manual
# dispatch can displace the pending final run), and no later run reaches 21:00 Tehran, no row is written
# for that day. A day with no row means no forecast was recorded; the next day's tries do not backfill it.
on:
  schedule:
    - cron: '30 10,12,14 * * *'
    # its own entry: github.event.schedule holds the cron string that fired, so the last try is told apart
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two runs never overlap; a second one waits for the first.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    # Scheduled and manual runs of any other branch must not commit forecasts or deploy the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      # The scripts retry each request themselves and stop fetching after a time budget (600 s for
      # predict, 300 s for fill_outcomes), so there is no retry loop here. Exit status 3 means "ran,
      # but some cells have a gap" (predict) or "could not fetch yet" (fill_outcomes); exit status 4
      # means "some cells are not ready yet, the next try will retry them" (predict). All are
      # expected. The step timeouts are a second limit above those budgets, and continue-on-error
      # lets the commit step save whatever was already written even if a step is cut off.
      # The 16:30 UTC try is the day's last: it is told so with --final.
      - name: Issue today's forecast
        id: predict
        timeout-minutes: 15
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          status=0
          final=""
          if [ "$SCHEDULE" = "30 16 * * *" ]; then final="--final"; fi
          python -m pipeline.predict $final || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::some cells have no forecast (gaps were recorded)"; status=0; fi
          if [ "$status" -eq 4 ]; then echo "::warning::some cells are not ready yet; the next try retries them"; status=0; fi
          if [ "$status" -ne 0 ]; then echo "::error::predict failed with status $status"; fi
          exit "$status"

      - name: Fill outcomes for finished days
        id: fill
        timeout-minutes: 10
        continue-on-error: true
        run: |
          status=0
          python -m pipeline.fill_outcomes || status=$?
          if [ "$status" -eq 3 ]; then echo "::warning::outcomes not filled this run; they are retried tomorrow"; status=0; fi
          if [ "$status" -ne 0 ]; then echo "::error::fill_outcomes failed with status $status"; fi
          exit "$status"

      # Only data/predictions.json is ever committed, and only when it changed.
      - name: Commit predictions
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          if git diff --cached --quiet; then
            echo "predictions.json unchanged; nothing to commit"
          else
            git commit -m "chore: update forecasts $(date -u +%F)"
            git push || { git pull --rebase && git push; }
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # continue-on-error above only lets the commit save gaps first. A crash or a step timeout still
      # fails the run here (outcome is the result before continue-on-error), so it shows red and the
      # site is not redeployed from a broken run.
      - name: Fail the run if a step crashed
        if: ${{ always() && (steps.predict.outcome == 'failure' || steps.fill.outcome == 'failure') }}
        run: |
          echo "::error::predict: ${{ steps.predict.outcome }}, fill_outcomes: ${{ steps.fill.outcome }}"
          exit 1

  build:
    needs: forecast
    # A try that saved nothing new has nothing to deploy.
    if: ${{ needs.forecast.outputs.committed == 'true' }}
    runs-on: ubuntu-latest
    # configure-pages needs pages: write (it reads and can enable the Pages site).
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.forecast.outputs.sha }}
      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `build` copies the model and data/predictions.json into the site, type checks, and builds into web/dist.
      - run: pnpm build
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # The same group as pages.yml, so this deploy and a deploy after a push to main never overlap.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
