name: Daily forecast

# Every day at 10:00 UTC (13:30 in Tehran, after the 12:00 Tehran cutoff): issue the forecast for
# tomorrow's Tehran date, fill in outcomes for days that have ended, commit data/predictions.json,
# then build the site and deploy it to GitHub Pages in this same workflow. (A commit pushed with
# GITHUB_TOKEN does not trigger other workflows, so the deploy cannot live in a separate one.)
# The target date comes from Tehran time inside the script, never from the runner's clock, so a
# late or manually started run still forecasts the right day.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two runs never overlap; a second one waits for the first.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      # Exit status 3 means "ran, but some cells have a gap" (predict) or "could not fetch yet"
      # (fill_outcomes): try again a few times, then carry on with what we have. Any other failure
      # stops the workflow.
      - name: Issue today's forecast
        run: |
          status=0
          for attempt in 1 2 3; do
            python -m pipeline.predict && status=0 && break
            status=$?
            [ "$status" -ne 3 ] && break
            [ "$attempt" -lt 3 ] && sleep 120
          done
          if [ "$status" -eq 3 ]; then echo "::warning::some cells have no forecast (gaps were recorded)"; status=0; fi
          exit "$status"

      - name: Fill outcomes for finished days
        run: |
          status=0
          for attempt in 1 2 3; do
            python -m pipeline.fill_outcomes && status=0 && break
            status=$?
            [ "$status" -ne 3 ] && break
            [ "$attempt" -lt 3 ] && sleep 120
          done
          if [ "$status" -eq 3 ]; then echo "::warning::outcomes not filled this run; they are retried tomorrow"; status=0; fi
          exit "$status"

      # Only data/predictions.json is ever committed, and only when it changed.
      - name: Commit predictions
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          if git diff --cached --quiet; then
            echo "predictions.json unchanged; nothing to commit"
          else
            git commit -m "chore: update forecasts $(date -u +%F)"
            git push || { git pull --rebase && git push; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: forecast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.forecast.outputs.sha }}
      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `build` copies the model and data/predictions.json into the site, type checks, and builds into web/dist.
      - run: pnpm build
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
